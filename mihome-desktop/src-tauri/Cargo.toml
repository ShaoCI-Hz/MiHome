[package]
name = "mihome-desktop"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mihome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# DPAPI 加密存凭据：本机凭据管理器对稍长 blob 报 ERROR_NOT_ENOUGH_MEMORY（系统故障），改用 DPAPI 加密文件
windows-sys = { version = "0.52", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 凭据以 DPAPI（CryptProtectData）加密落盘 %APPDATA%/mihome-desktop/auth.bin，不落明文。
# 弃用凭据管理器：部分 Win11 24H2/25H2 系统 CredWrite 对稍长 blob 误报 ERROR_NOT_ENOUGH_MEMORY(8)
# 登录回调需读取 Set-Cookie（JS 侧被浏览器规范过滤），用 reqwest 在 Rust 侧完成
reqwest = { version = "0.12", features = ["gzip"] }
# 窗口毛玻璃（Win11 Mica / Win10 Acrylic）
window-vibrancy = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
